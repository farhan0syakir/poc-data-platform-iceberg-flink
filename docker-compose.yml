name: iceberg-flink-local

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - data-platform

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/raw || true;
      mc mb -p local/warehouse || true;
      mc mb -p local/checkpoints || true;
      echo 'Buckets initialized: raw, warehouse, checkpoints';
      "
    networks:
      - data-platform

  postgres:
    image: postgres:16-alpine
    container_name: nessie-postgres
    environment:
      POSTGRES_DB: nessie
      POSTGRES_USER: nessie
      POSTGRES_PASSWORD: nessie
    volumes:
      - nessie-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nessie -d nessie"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - data-platform

  nessie:
    image: projectnessie/nessie:latest
    container_name: nessie
    environment:
      NESSIE_VERSION_STORE_TYPE: JDBC
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/nessie
      QUARKUS_DATASOURCE_USERNAME: nessie
      QUARKUS_DATASOURCE_PASSWORD: nessie
      QUARKUS_HTTP_PORT: 19120
    ports:
      - "19120:19120"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data-platform

  flink-jobmanager:
    image: flink:1.20.1-scala_2.12-java17
    container_name: flink-jobmanager
    command: >
      bash -lc "
      mkdir -p /opt/flink/plugins/s3-fs-hadoop &&
      cp /opt/flink/opt/flink-s3-fs-hadoop-*.jar /opt/flink/plugins/s3-fs-hadoop/ &&
      /docker-entrypoint.sh jobmanager
      "
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
    ports:
      - "8081:8081"
    volumes:
      - ./config/flink/flink-conf.yaml:/opt/flink/conf/flink-conf.yaml
    depends_on:
      minio-init:
        condition: service_completed_successfully
      nessie:
        condition: service_started
    networks:
      - data-platform

  flink-taskmanager:
    image: flink:1.20.1-scala_2.12-java17
    container_name: flink-taskmanager
    command: >
      bash -lc "
      mkdir -p /opt/flink/plugins/s3-fs-hadoop &&
      cp /opt/flink/opt/flink-s3-fs-hadoop-*.jar /opt/flink/plugins/s3-fs-hadoop/ &&
      /docker-entrypoint.sh taskmanager
      "
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
    volumes:
      - ./config/flink/flink-conf.yaml:/opt/flink/conf/flink-conf.yaml
    depends_on:
      flink-jobmanager:
        condition: service_started
    networks:
      - data-platform

  trino:
    image: trinodb/trino:latest
    container_name: trino
    ports:
      - "8080:8080"
    volumes:
      - ./config/trino/node.properties:/etc/trino/node.properties:ro
      - ./config/trino/config.properties:/etc/trino/config.properties:ro
      - ./config/trino/jvm.config:/etc/trino/jvm.config:ro
      - ./config/trino/log.properties:/etc/trino/log.properties:ro
      - ./config/trino/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
    depends_on:
      minio-init:
        condition: service_completed_successfully
      nessie:
        condition: service_started
    networks:
      - data-platform

  sqlpad:
    image: sqlpad/sqlpad:latest
    container_name: sqlpad
    ports:
      - "3010:3000"
    environment:
      SQLPAD_AUTH_DISABLED: "true"
      SQLPAD_CONNECTIONS__trino__name: Trino
      SQLPAD_CONNECTIONS__trino__driver: trino
      SQLPAD_CONNECTIONS__trino__host: trino
      SQLPAD_CONNECTIONS__trino__port: "8080"
      SQLPAD_CONNECTIONS__trino__username: trino
      SQLPAD_CONNECTIONS__trino__catalog: iceberg
      SQLPAD_CONNECTIONS__trino__schema: demo
    depends_on:
      trino:
        condition: service_started
    networks:
      - data-platform

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
    networks:
      - data-platform

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - data-platform

networks:
  data-platform:
    name: data-platform

volumes:
  minio-data:
  nessie-postgres:
  grafana-data:


